[project]
name = "PiWatering"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "A", email = "_"},
]
dependencies = [
    "python-dotenv>=1.0.1",
    "gpiozero>=2.0.1",
    "influxdb-client>=1.48.0",
    "influxdb>=5.3.2",
    "flask>=3.1.0",
]
requires-python = "==3.12.*"
readme = "README.md"
license = {text = "MIT"}


[tool.pdm]
distribution = false

[tool.pdm.scripts]
start = "flask --app src.piwater.app run"