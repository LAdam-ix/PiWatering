<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GPIO Control</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            function updateSensorStatuses() {
                $.ajax({
                    url: '/sensor_statuses',
                    method: 'GET',
                    success: function(data) {
                        $('#sensor1_status').text(data.sensor1_status );
                        $('#sensor2_status').text(data.sensor2_status);
                    }
                });
            }

            setInterval(updateSensorStatuses, 1000); // Refresh every second
        });
    </script>
</head>
<body>
    <h1>GPIO Control Interface</h1>
    <p>Sensor 1 Status: <span id="sensor1_status">{{ 'Active' if timer_running else 'Inactive' }}</span></p>
    <p>Sensor 2 Status: <span id="sensor2_status">{{ 'Active' if timer_running else 'Inactive' }}</span></p>
    <form action="/activate_valve" method="get">
        <button type="submit">Activate Valve</button>
    </form>
    <form action="/start_timer" method="post">
        <label for="duration">Timer Duration (seconds):</label>
        <input type="number" id="duration" name="duration" required>
        <button type="submit">Start Timer</button>
    </form>
</body>
</html>
