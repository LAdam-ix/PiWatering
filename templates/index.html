<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PiWater Control</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 0; background: #f4f5f4; color: #222; }
    header { background: #2e7d32; color: #fff; padding: 14px 16px; font-size: 18px; font-weight: 600; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 12px; }
    .valve { background: #fff; border-radius: 12px; padding: 14px; margin: 10px 0; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
    .valve.unwired { opacity: .55; }
    .row { display: flex; align-items: center; justify-content: space-between; }
    .name { font-weight: 600; font-size: 16px; }
    .state { font-size: 13px; color: #777; }
    .btns { display: flex; gap: 8px; margin-top: 10px; }
    button { flex: 1; padding: 11px; border: 0; border-radius: 8px; font-size: 15px; color: #fff; cursor: pointer; }
    .on { background: #2e7d32; } .off { background: #c62828; }
    .timer { background: #1565c0; } .stop { background: #ef6c00; }
    .timerrow { display: flex; gap: 8px; margin-top: 8px; }
    .timerrow input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
  </style>
</head>
<body>
  <header>PiWater · Control</header>
  <div class="wrap">
    {% for v in garden.zones() %}
    <div class="valve {% if not v.wired %}unwired{% endif %}" data-valve="{{ v.name }}">
      <div class="row">
        <span class="name">{{ v.name }}</span>
        <span class="state">…</span>
      </div>
      <div class="btns">
        <button class="on" onclick="act(this,'open')">On</button>
        <button class="off" onclick="act(this,'close')">Off</button>
      </div>
      <div class="timerrow">
        <input type="number" min="1" name="duration" placeholder="seconds">
        <button class="timer" onclick="startTimer(this)">Timer</button>
        <button class="stop" onclick="stopTimer(this)">Stop</button>
      </div>
    </div>
    {% endfor %}
  </div>

  <script>
    const REFRESH = {{ refresh_interval }} * 1000;
    const card = el => el.closest('.valve');
    const vname = el => card(el).dataset.valve;

    async function post(name, path, body) {
      await fetch(`/valve/${encodeURIComponent(name)}/${path}`, { method: 'POST', body });
      refresh();
    }
    async function act(btn, action) { await post(vname(btn), action); }
    async function startTimer(btn) {
      const dur = card(btn).querySelector('input[name=duration]').value;
      if (dur) await post(vname(btn), 'timer', new URLSearchParams({ duration: dur }));
    }
    async function stopTimer(btn) { await post(vname(btn), 'timer/stop'); }

    async function refresh() {
      const data = await (await fetch('/valves/status')).json();
      document.querySelectorAll('.valve').forEach(c => {
        const s = data[c.dataset.valve];
        if (!s) return;
        let txt = !s.wired ? 'not wired' : (s.open ? 'OPEN' : 'closed');
        if (s.timer_remaining > 0) txt += ` · ${s.timer_remaining}s left`;
        c.querySelector('.state').textContent = txt;
      });
    }
    refresh();
    setInterval(refresh, REFRESH);
  </script>
</body>
</html>
